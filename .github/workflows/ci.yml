name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can compile. The build does not connect.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kates_game_night
      BETTER_AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_EMAILS: kate@example.com
      SECURITY_ANSWER: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
